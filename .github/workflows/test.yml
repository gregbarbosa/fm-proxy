name: test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The proxy has no dependencies, so there is nothing to install. The live
      # token-count tests skip, because a Linux runner has no `fm`.
      - run: npm test
